# 品牌助手 Bot 的配置片段。
# 创建 Bot 时从 default 克隆（模型和 Key 沿用 default），再把下面两段合并进该 Bot 的 config.yaml。
# 注意：MCP 写在 config.yaml 的 mcp_servers 里，Bot 不读 mcp.json。

mcp_servers:
  hermes-workbench:
    # 工作台后端随 workbench-api 启动，只监听本机。
    url: http://127.0.0.1:8000/mcp
    # 只给这个 Bot 用到的工具（Hermes 的 tools.include 白名单）。
    tools:
      include:
        - wb_list_campaigns
        - wb_get_campaign
        - wb_check_compliance
        - wb_get_product_card
        - wb_get_brand_guide
        - wb_get_overview
        - wb_get_trend
        - wb_list_contents
        - wb_get_content
        - wb_create_draft

agent:
  # 品牌助手只查资料、查活动和检查文案，不需要执行命令、操作浏览器、跑代码或改本地文件。
  disabled_toolsets:
    - terminal
    - browser
    - code_execution
    - file
    - delegation      # 不能让子代理去跑命令或装软件（WK05 出现过）
    - desktop_ui      # 含 read_terminal（WK02 调用过）
    - computer_use
    - cronjob

# 不让 Bot 在后台自己建或改技能（WK02/WK05 各自动建了一个）。要加技能由人从技能市场装。
auxiliary:
  background_review:
    enabled: false
curator:
  enabled: false
skills:
  write_approval: true
