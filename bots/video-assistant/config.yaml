# 视频助手 Bot 的配置片段。
# 创建 Bot 时从 default 克隆（模型和 Key 沿用 default），再把下面两段合并进该 Bot 的 config.yaml。
# 注意：MCP 写在 config.yaml 的 mcp_servers 里，Bot 不读 mcp.json。
# 配音用 Hermes 自带的 tts 工具集（text_to_speech，默认 Edge TTS，免费），画面用 image_gen 工具集（image_generate），见 README。

mcp_servers:
  hermes-workbench:
    url: http://127.0.0.1:8000/mcp
    tools:
      include:
        - wb_list_video_projects
        - wb_get_video_project
        - wb_create_video_project
        - wb_add_shot_media
        - wb_search_library
        - wb_get_product_card
        - wb_get_brand_guide
        - wb_check_compliance
        - wb_list_campaigns

agent:
  # 只需要配音（tts）、生图（image_gen）和看图（vision）；不执行命令、不操作浏览器、不跑代码、不改本地文件。
  disabled_toolsets:
    - terminal
    - browser
    - code_execution
    - file
